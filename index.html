<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Time de Hoje</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0F1D17;
    --bg-2: #14261D;
    --panel: #17291F;
    --panel-border: #24402F;
    --court: #1E5C3E;
    --court-2: #24693F;
    --line: rgba(242,241,234,0.55);
    --chalk: #F2F1EA;
    --gold: #D9A441;
    --gold-deep: #B9852D;
    --text: #EDE9DD;
    --text-dim: #9FB5A8;
    --danger: #C1503F;
    --danger-deep: #A3402F;
    --font-head: 'Barlow Condensed', 'Arial Narrow', sans-serif;
    --font-body: 'Inter', system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #0F1D17; --bg-2: #14261D; --panel: #17291F; --panel-border: #24402F;
      --court: #1E5C3E; --court-2: #24693F; --line: rgba(242,241,234,0.55);
      --chalk: #F2F1EA; --gold: #D9A441; --gold-deep: #B9852D;
      --text: #EDE9DD; --text-dim: #9FB5A8; --danger: #C1503F; --danger-deep:#A3402F;
    }
  }
  :root[data-theme="dark"]{
    --bg: #0F1D17; --bg-2: #14261D; --panel: #17291F; --panel-border: #24402F;
    --court: #1E5C3E; --court-2: #24693F; --line: rgba(242,241,234,0.55);
    --chalk: #F2F1EA; --gold: #D9A441; --gold-deep: #B9852D;
    --text: #EDE9DD; --text-dim: #9FB5A8; --danger: #C1503F; --danger-deep:#A3402F;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background: radial-gradient(ellipse at top, var(--bg-2), var(--bg) 60%);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    padding: 18px 14px 40px;
  }

  .wrap{ max-width: 480px; margin: 0 auto; }

  header{
    display:flex; align-items:flex-start; justify-content:space-between;
    gap: 10px; margin-bottom: 14px;
  }
  h1{
    font-family: var(--font-head);
    font-weight: 700;
    font-size: 34px;
    letter-spacing: 0.3px;
    margin: 0 0 2px;
    color: var(--chalk);
  }
  .subtitle{
    margin: 0;
    color: var(--text-dim);
    font-size: 14px;
    line-height: 1.4;
  }
  .share-btn{
    flex: 0 0 auto;
    display: flex;
    align-items:center; gap:6px;
    font-family: var(--font-body);
    font-weight:600; font-size:13px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--chalk);
    padding: 9px 12px;
    border-radius: 999px;
    cursor: pointer;
    margin-top: 4px;
  }
  .share-btn:active{ border-color: var(--gold); color: var(--gold); }
  .share-btn.busy{ opacity: 0.6; }

  /* Formation switch */
  .format-switch{
    display:flex;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 999px;
    padding: 4px;
    gap: 4px;
    margin: 0 0 12px;
  }
  .fmt-btn{
    flex:1;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 13px;
    border: none;
    background: transparent;
    color: var(--text-dim);
    padding: 9px 6px;
    border-radius: 999px;
    cursor: pointer;
  }
  .fmt-btn.active{ background: var(--gold); color:#241605; }

  /* Court */
  .court-shell{
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 10px;
    margin: 0 0 14px;
  }
  .court{
    position: relative;
    width: 100%;
    aspect-ratio: 3 / 4.6;
    background:
      radial-gradient(circle at 50% 82%, rgba(255,255,255,0.05), transparent 40%),
      repeating-linear-gradient(
        180deg,
        var(--court) 0px, var(--court) 40px,
        var(--court-2) 40px, var(--court-2) 80px
      );
    border: 2px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
    touch-action: none;
  }
  .court::before{
    content:"";
    position:absolute; left:50%; top:0; bottom:0; width:2px;
    background: var(--line); transform: translateX(-50%);
  }
  .center-circle{
    position:absolute; left:50%; top:50%; width:26%; aspect-ratio:1;
    border:2px solid var(--line); border-radius:50%;
    transform: translate(-50%,-50%);
  }
  .goal-area{
    position:absolute; left:50%; width:46%; height:13%;
    border:2px solid var(--line);
    transform: translateX(-50%);
  }
  .goal-area.top{ top:-2px; border-top:none; border-radius: 0 0 40px 40px / 0 0 60px 60px; }
  .goal-area.bottom{ bottom:-2px; border-bottom:none; border-radius: 40px 40px 0 0 / 60px 60px 0 0; }

  .slot{
    position: absolute;
    width: 76px; height: 76px;
    transform: translate(-50%,-50%);
    border-radius: 50%;
    border: 2px dashed rgba(242,241,234,0.35);
    display:flex; align-items:center; justify-content:center;
    flex-direction: column;
    background: rgba(15,29,23,0.18);
  }
  .court.dense .slot{ width: 56px; height: 56px; }
  .slot-tag{
    position:absolute; bottom:-18px; left:50%; transform:translateX(-50%);
    font-family: var(--font-head); font-size: 11.5px; letter-spacing:0.4px;
    color: var(--text-dim); white-space:nowrap;
  }
  .slot.drop-hover{ border-color: var(--gold); background: rgba(217,164,65,0.15); }

  /* Reserve slots (horizontal row, not positioned absolutely) */
  .reserves-row{
    display:flex; gap: 16px;
    padding: 4px 4px 22px;
    overflow-x: auto;
  }
  .slot.reserve-slot{
    position: relative;
    transform: none;
    flex: 0 0 auto;
    width: 60px; height: 60px;
  }

  /* Chips */
  .chip{
    display:inline-flex; align-items:center; gap:6px;
    background: var(--gold);
    color: #241605;
    font-weight: 600;
    font-size: 13px;
    padding: 7px 10px 7px 11px;
    border-radius: 999px;
    border: none;
    cursor: grab;
    user-select: none;
    touch-action: none;
    max-width: 130px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chip.on-court{
    background: var(--chalk);
    box-shadow: 0 2px 0 rgba(0,0,0,0.25);
    max-width: 66px;
    font-size: 12px;
    padding: 6px 8px;
  }
  .court.dense .chip.on-court{ max-width: 48px; font-size: 10.5px; padding: 4px 6px; }
  .reserve-slot .chip.on-court{ max-width: 52px; font-size: 11px; padding: 5px 7px; }
  .chip.selected{ outline: 2px solid var(--danger); outline-offset:2px; }
  .chip.dragging{ opacity:0.9; cursor:grabbing; box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
  .chip .rm{
    border:none; background:transparent; color:inherit; opacity:0.55;
    font-size:14px; line-height:1; padding:0 0 0 2px; cursor:pointer;
  }
  .chip .rm:hover{ opacity:1; }

  /* Panels */
  .panel{
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 14px;
  }
  .panel-head{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom: 10px;
  }
  h2{
    font-family: var(--font-head); font-weight:600; font-size:20px;
    margin:0; color: var(--chalk); letter-spacing:0.2px;
  }
  .hint{ font-size:12px; color:var(--text-dim); }

  .bench{
    display:flex; flex-wrap:wrap; gap:8px;
    min-height: 48px;
    padding: 6px;
    border-radius: 10px;
    border: 1px dashed transparent;
  }
  .bench.drop-hover{ border-color: var(--gold); background: rgba(217,164,65,0.08); }
  .bench:empty::before{
    content: "Banco vazio — adiciona jogadores abaixo";
    color: var(--text-dim); font-size: 13px; padding: 6px 2px;
  }

  .add-row{ display:flex; gap:8px; }
  .add-row input{
    flex:1;
    background: var(--bg-2);
    border: 1px solid var(--panel-border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 14px;
    font-family: var(--font-body);
  }
  .add-row input:focus{ outline: 1.5px solid var(--gold); }
  .btn{
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 14px;
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    cursor: pointer;
  }
  .btn-gold{ background: var(--gold); color:#241605; }
  .btn-gold:active{ background: var(--gold-deep); }
  .btn-ghost{
    background: transparent; color: var(--text-dim);
    border: 1px solid var(--panel-border);
    font-size: 12px; padding: 6px 10px;
    cursor: pointer;
  }
  .btn-ghost:active{ border-color: var(--danger); color: var(--danger); }

  footer{ text-align:center; color: var(--text-dim); font-size:11px; margin-top: 6px; }

  .toast{
    position: fixed; left:50%; bottom: 24px; transform: translateX(-50%) translateY(20px);
    background: var(--chalk); color:#1a2620;
    font-size: 13px; font-weight: 600;
    padding: 10px 16px; border-radius: 999px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.35);
    opacity: 0; transition: opacity 0.2s ease, transform 0.2s ease;
    pointer-events: none; z-index: 2000;
  }
  .toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Time de Hoje</h1>
      <p class="subtitle">Escala o time e resolve a pelada — futsal, society ou campo.</p>
    </div>
    <button class="share-btn" id="shareBtn" type="button">Compartilhar</button>
  </header>

  <div class="format-switch" id="formatSwitch">
    <button class="fmt-btn" data-format="futsal">Futsal</button>
    <button class="fmt-btn" data-format="society">Society</button>
    <button class="fmt-btn" data-format="campo">Campo</button>
  </div>

  <div class="court-shell" id="courtShell">
    <div class="court" id="court">
      <div class="goal-area top"></div>
      <div class="goal-area bottom"></div>
      <div class="center-circle"></div>
      <div class="slots-layer" id="slotsLayer"></div>
    </div>
  </div>

  <div class="panel" id="reservesPanel">
    <div class="panel-head">
      <h2>Reservas</h2>
      <span class="hint">5 vagas no banco de reservas</span>
    </div>
    <div class="reserves-row" id="reservesRow"></div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <h2>Banco</h2>
      <button class="btn-ghost" id="clearBtn">Tirar todos da quadra</button>
    </div>
    <div class="bench" id="bench"></div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <h2>Elenco</h2>
      <span class="hint" id="countHint"></span>
    </div>
    <div class="add-row">
      <input id="nameInput" placeholder="Nome do jogador" maxlength="20" />
      <button class="btn btn-gold" id="addBtn">Adicionar</button>
    </div>
  </div>

  <footer>Fica salvo neste aparelho, só pra ti.</footer>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
(function(){
  var STORAGE_KEY = 'lousa-tatica-v2';
  var RESERVE_COUNT = 5;

  var FORMATIONS = {
    futsal: { label:'Futsal', dense:false, slots:[
      {key:'gol',  label:'Goleiro',      top:88, left:50},
      {key:'fixo', label:'Fixo',         top:65, left:50},
      {key:'alae', label:'Ala esq.',     top:42, left:20},
      {key:'alad', label:'Ala dir.',     top:42, left:80},
      {key:'pivo', label:'Pivô',         top:13, left:50}
    ]},
    society: { label:'Society', dense:false, slots:[
      {key:'gol',  label:'Goleiro',       top:90, left:50},
      {key:'zage', label:'Zagueiro esq.', top:72, left:30},
      {key:'zagd', label:'Zagueiro dir.', top:72, left:70},
      {key:'meie', label:'Meia esq.',     top:46, left:18},
      {key:'meic', label:'Meia central',  top:48, left:50},
      {key:'meid', label:'Meia dir.',     top:46, left:82},
      {key:'ata',  label:'Atacante',      top:14, left:50}
    ]},
    campo: { label:'Campo', dense:true, slots:[
      {key:'gol',   label:'Goleiro',       top:92, left:50},
      {key:'late',  label:'Lateral esq.',  top:75, left:12},
      {key:'zage',  label:'Zagueiro esq.', top:80, left:38},
      {key:'zagd',  label:'Zagueiro dir.', top:80, left:62},
      {key:'latd',  label:'Lateral dir.',  top:75, left:88},
      {key:'meie',  label:'Meia esq.',     top:48, left:12},
      {key:'vol',   label:'Volante',       top:52, left:38},
      {key:'meic',  label:'Meia central',  top:52, left:62},
      {key:'meid',  label:'Meia dir.',     top:48, left:88},
      {key:'ata1',  label:'Atacante',      top:18, left:38},
      {key:'ata2',  label:'Atacante',      top:18, left:62}
    ]}
  };

  var players = [];
  var selectedId = null;
  var currentFormation = 'futsal';

  function load(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        var data = JSON.parse(raw);
        if(Array.isArray(data.players)) players = data.players;
        if(data.formation && FORMATIONS[data.formation]) currentFormation = data.formation;
      }
    }catch(e){ players = []; }
    if(!Array.isArray(players)) players = [];
  }
  function save(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ players: players, formation: currentFormation }));
    }catch(e){}
  }

  function uid(){ return 'p' + Math.random().toString(36).slice(2,9); }
  function slotId(key){ return currentFormation + ':' + key; }
  function reserveId(n){ return currentFormation + ':res' + n; }

  function addPlayer(name){
    name = name.trim();
    if(!name) return;
    players.push({ id: uid(), name: name, slot: null });
    save(); render();
  }
  function removePlayer(id){
    players = players.filter(function(p){ return p.id !== id; });
    if(selectedId === id) selectedId = null;
    save(); render();
  }
  function clearCourt(){
    players.forEach(function(p){
      if(p.slot && p.slot.indexOf(currentFormation + ':') === 0) p.slot = null;
    });
    save(); render();
  }
  function assign(id, fullSlotKey){
    var player = players.find(function(p){ return p.id === id; });
    if(!player) return;
    if(fullSlotKey === null){ player.slot = null; save(); return; }
    var occupant = players.find(function(p){ return p.slot === fullSlotKey && p.id !== id; });
    var oldSlot = player.slot;
    if(occupant) occupant.slot = oldSlot;
    player.slot = fullSlotKey;
    save();
  }

  function makeChip(player, onCourt){
    var chip = document.createElement('div');
    chip.className = 'chip' + (onCourt ? ' on-court' : '');
    chip.dataset.id = player.id;
    if(player.id === selectedId) chip.classList.add('selected');

    var nameSpan = document.createElement('span');
    nameSpan.textContent = player.name;
    chip.appendChild(nameSpan);

    var rm = document.createElement('button');
    rm.className = 'rm';
    rm.textContent = '×';
    rm.title = 'Remover do elenco';
    rm.addEventListener('click', function(ev){
      ev.stopPropagation();
      removePlayer(player.id);
    });
    chip.appendChild(rm);

    attachDrag(chip, player.id);
    chip.addEventListener('click', function(){
      if(chip.dataset.justDragged === '1'){ chip.dataset.justDragged = '0'; return; }
      selectedId = (selectedId === player.id) ? null : player.id;
      render();
    });
    return chip;
  }

  function makeSlotElement(fullId, label, extraClass){
    var el = document.createElement('div');
    el.className = 'slot' + (extraClass ? ' ' + extraClass : '');
    el.dataset.slot = fullId;
    var tag = document.createElement('span');
    tag.className = 'slot-tag';
    tag.textContent = label;
    el.appendChild(tag);
    el.addEventListener('click', function(ev){
      if(ev.target.closest('.chip')) return;
      if(selectedId){
        assign(selectedId, el.dataset.slot);
        selectedId = null;
        render();
      }
    });
    return el;
  }

  function renderSlots(){
    var layer = document.getElementById('slotsLayer');
    var court = document.getElementById('court');
    var formation = FORMATIONS[currentFormation];
    court.classList.toggle('dense', !!formation.dense);
    layer.innerHTML = '';
    formation.slots.forEach(function(s){
      var el = makeSlotElement(slotId(s.key), s.label);
      el.style.top = s.top + '%';
      el.style.left = s.left + '%';
      layer.appendChild(el);
    });
  }

  function renderReserves(){
    var row = document.getElementById('reservesRow');
    row.innerHTML = '';
    for(var i = 1; i <= RESERVE_COUNT; i++){
      var el = makeSlotElement(reserveId(i), 'Res. ' + i, 'reserve-slot');
      row.appendChild(el);
    }
  }

  function render(){
    renderSlots();
    renderReserves();

    document.querySelectorAll('.slot').forEach(function(slotEl){
      var key = slotEl.dataset.slot;
      var occ = players.find(function(p){ return p.slot === key; });
      if(occ){ slotEl.appendChild(makeChip(occ, true)); }
    });

    var bench = document.getElementById('bench');
    bench.innerHTML = '';
    players.filter(function(p){
      return !(p.slot && p.slot.indexOf(currentFormation + ':') === 0);
    }).forEach(function(p){
      bench.appendChild(makeChip(p, false));
    });

    var formation = FORMATIONS[currentFormation];
    var total = formation.slots.length;
    var onField = players.filter(function(p){
      return formation.slots.some(function(s){ return p.slot === slotId(s.key); });
    }).length;
    var onReserve = players.filter(function(p){
      return p.slot && p.slot.indexOf(currentFormation + ':res') === 0;
    }).length;
    document.getElementById('countHint').textContent = players.length
      ? (onField + '/' + total + ' titulares · ' + onReserve + '/' + RESERVE_COUNT + ' reservas · ' + players.length + ' no elenco')
      : '';

    document.querySelectorAll('.fmt-btn').forEach(function(btn){
      btn.classList.toggle('active', btn.dataset.format === currentFormation);
    });
  }

  function attachDrag(chip, id){
    chip.addEventListener('pointerdown', function(e){
      e.preventDefault();
      var startX = e.clientX, startY = e.clientY;
      var moved = false;
      var rect = chip.getBoundingClientRect();
      var offsetX = e.clientX - rect.left;
      var offsetY = e.clientY - rect.top;

      function onMove(ev){
        var dx = ev.clientX - startX, dy = ev.clientY - startY;
        if(!moved && (Math.abs(dx) > 6 || Math.abs(dy) > 6)){
          moved = true;
          chip.classList.add('dragging');
          chip.style.position = 'fixed';
          chip.style.zIndex = '1000';
          chip.style.width = rect.width + 'px';
          document.body.appendChild(chip);
        }
        if(moved){
          chip.style.left = (ev.clientX - offsetX) + 'px';
          chip.style.top = (ev.clientY - offsetY) + 'px';
          document.querySelectorAll('.drop-hover').forEach(function(el){ el.classList.remove('drop-hover'); });
          chip.style.pointerEvents = 'none';
          var under = document.elementFromPoint(ev.clientX, ev.clientY);
          chip.style.pointerEvents = '';
          var slotEl = under && under.closest && under.closest('.slot');
          var benchEl = under && under.closest && under.closest('#bench');
          if(slotEl) slotEl.classList.add('drop-hover');
          else if(benchEl) benchEl.classList.add('drop-hover');
        }
      }
      function onUp(ev){
        chip.removeEventListener('pointermove', onMove);
        chip.removeEventListener('pointerup', onUp);
        chip.removeEventListener('pointercancel', onUp);
        document.querySelectorAll('.drop-hover').forEach(function(el){ el.classList.remove('drop-hover'); });
        if(moved){
          chip.dataset.justDragged = '1';
          chip.style.pointerEvents = 'none';
          var under = document.elementFromPoint(ev.clientX, ev.clientY);
          chip.style.pointerEvents = '';
          var slotEl = under && under.closest && under.closest('.slot');
          var benchEl = under && under.closest && under.closest('#bench');
          selectedId = null;
          if(slotEl) assign(id, slotEl.dataset.slot);
          else if(benchEl) assign(id, null);
          chip.classList.remove('dragging');
          chip.style.position=''; chip.style.zIndex='';
          chip.style.left=''; chip.style.top=''; chip.style.width='';
          render();
        }
      }
      chip.addEventListener('pointermove', onMove);
      chip.addEventListener('pointerup', onUp);
      chip.addEventListener('pointercancel', onUp);
    });
  }

  document.getElementById('bench').addEventListener('click', function(ev){
    if(ev.target.closest('.chip')) return;
    if(selectedId){
      assign(selectedId, null);
      selectedId = null;
      render();
    }
  });

  document.getElementById('formatSwitch').addEventListener('click', function(ev){
    var btn = ev.target.closest('.fmt-btn');
    if(!btn) return;
    currentFormation = btn.dataset.format;
    selectedId = null;
    save(); render();
  });

  document.getElementById('addBtn').addEventListener('click', function(){
    var input = document.getElementById('nameInput');
    addPlayer(input.value);
    input.value = '';
    input.focus();
  });
  document.getElementById('nameInput').addEventListener('keydown', function(e){
    if(e.key === 'Enter'){
      addPlayer(this.value);
      this.value = '';
    }
  });
  document.getElementById('clearBtn').addEventListener('click', clearCourt);

  // --- Share as image ---
  var toastEl = document.getElementById('toast');
  var toastTimer = null;
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 2600);
  }

  function buildShareCard(){
    var card = document.createElement('div');
    card.style.cssText = 'position:fixed;left:-9999px;top:0;width:420px;padding:20px;' +
      'background:linear-gradient(180deg,' + getVar('--bg-2') + ',' + getVar('--bg') + ');' +
      'font-family:' + getVar('--font-body') + ';color:' + getVar('--text') + ';border-radius:16px;';

    var title = document.createElement('div');
    title.style.cssText = 'font-family:' + getVar('--font-head') + ';font-weight:700;font-size:28px;color:' + getVar('--chalk') + ';margin-bottom:2px;';
    title.textContent = 'Time de Hoje';
    card.appendChild(title);

    var sub = document.createElement('div');
    sub.style.cssText = 'font-size:13px;color:' + getVar('--text-dim') + ';margin-bottom:14px;';
    sub.textContent = FORMATIONS[currentFormation].label + ' · escalação';
    card.appendChild(sub);

    var courtClone = document.getElementById('courtShell').cloneNode(true);
    courtClone.style.margin = '0 0 14px';
    card.appendChild(courtClone);

    var hasReserves = players.some(function(p){
      return p.slot && p.slot.indexOf(currentFormation + ':res') === 0;
    });
    if(hasReserves){
      var resClone = document.getElementById('reservesPanel').cloneNode(true);
      resClone.style.margin = '0';
      card.appendChild(resClone);
    }

    document.body.appendChild(card);
    return card;
  }
  function getVar(name){
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  async function shareOrDownloadBlob(blob, filename){
    if(navigator.share && navigator.canShare){
      try{
        var file = new File([blob], filename, { type: 'image/png' });
        if(navigator.canShare({ files: [file] })){
          await navigator.share({ files: [file], title: 'Time de Hoje' });
          return 'shared';
        }
      }catch(e){
        if(e && e.name === 'AbortError') return 'cancelled';
        // fall through to download
      }
    }
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    return 'downloaded';
  }

  document.getElementById('shareBtn').addEventListener('click', function(){
    if(!window.html2canvas) return;
    var btn = this;
    btn.classList.add('busy');
    btn.textContent = 'Gerando...';
    var card = buildShareCard();
    window.html2canvas(card, { backgroundColor: null, scale: 2 }).then(function(canvas){
      document.body.removeChild(card);
      canvas.toBlob(async function(blob){
        btn.classList.remove('busy');
        btn.textContent = 'Compartilhar';
        if(!blob) return;
        try{
          var result = await shareOrDownloadBlob(blob, 'time-de-hoje-' + currentFormation + '.png');
          if(result === 'downloaded') showToast('Imagem baixada — já dá pra mandar pro grupo');
        }catch(err){
          showToast('Não deu pra gerar a imagem agora');
        }
      }, 'image/png');
    }).catch(function(){
      if(card && card.parentNode) document.body.removeChild(card);
      btn.classList.remove('busy');
      btn.textContent = 'Compartilhar';
      showToast('Não deu pra gerar a imagem');
    });
  });

  load();
  render();
})();
</script>
